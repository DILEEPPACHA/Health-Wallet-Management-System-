<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button" onclick="window.history.back()" style="margin:10px;padding:8px 16px;border-radius:4px;border:1px solid #ccc;background-color:#f8f9fa;cursor:pointer;">← Back</button>
    <form action="storepdf" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" name="pdfname">
        <input type="text" name="adno" value="{{adno}}">
        <input type="file" name="pdf">
        <input type="submit" name="submit">
    </form>
</body>
</html>
